name: Daily Streamlit app checks

on:
  schedule:
    - cron: "0 18 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-streamlit-app-checks
  cancel-in-progress: false

jobs:
  check-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check checker behavior
        run: npm run test:app-checks
      - name: Visit and wake Streamlit apps
        run: npm run apps:check
      - name: Save check results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-app-check-results
          path: app-check-results/
          if-no-files-found: ignore
          retention-days: 14
